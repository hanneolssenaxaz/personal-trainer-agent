<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Debug - Personal Trainer Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .adminContainer { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .adminToolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
      .adminGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .adminCard { background: #fff; border: 1px solid #ece7f3; border-radius: 12px; padding: 12px; }
      .adminCard h3 { margin: 0 0 8px 0; }
      .adminPre {
        background: #faf8fd; border: 1px solid #ece7f3; border-radius: 10px;
        padding: 10px; white-space: pre-wrap; word-break: break-word;
        max-height: 320px; overflow: auto; font-size: 12px;
      }
      .span2 { grid-column: 1 / -1; }
      .small { font-size: 12px; color: #7e7391; }
      @media (max-width: 980px) { .adminGrid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="adminContainer">
      <header class="header">
        <h1>Admin / Debug Interface</h1>
        <p class="subtitle">Inspect logic, database state, and data flow end-to-end.</p>
      </header>

      <div class="adminToolbar">
        <label for="userIdInput">User ID</label>
        <input id="userIdInput" type="number" min="1" value="1" style="width: 90px;" />
        <button id="refreshBtn" class="primary">Refresh Snapshot</button>
        <a href="/" class="small">Go back to app</a>
      </div>

      <section class="adminGrid">
        <div class="adminCard">
          <h3>Meta</h3>
          <div id="meta" class="adminPre"></div>
        </div>

        <div class="adminCard">
          <h3>Logic View</h3>
          <div id="logicView" class="adminPre"></div>
        </div>

        <div class="adminCard">
          <h3>Table Counts</h3>
          <div id="tableCounts" class="adminPre"></div>
        </div>

        <div class="adminCard">
          <h3>Current State (high-level)</h3>
          <div id="currentState" class="adminPre"></div>
        </div>

        <div class="adminCard span2">
          <h3>Raw Tables</h3>
          <div id="rawTables" class="adminPre" style="max-height: 520px;"></div>
        </div>
      </section>
    </main>

    <script src="/static/admin.js"></script>
  </body>
</html>
